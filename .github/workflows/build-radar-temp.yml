name: Build Radar Corrida APK

on:
  push:
    branches:
      - build-radar-apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        shell: bash
        run: |
          cat .tmp/radar.part1 .tmp/radar.part2 .tmp/radar.part3 .tmp/radar.part4 .tmp/radar.part5 .tmp/radar.part6 .tmp/radar.part7 > /tmp/radar.b64
          base64 -d /tmp/radar.b64 > /tmp/radar.zip
          mkdir -p /tmp/radar-src
          unzip -q /tmp/radar.zip -d /tmp/radar-src
          test -f /tmp/radar-src/radar_corrida/settings.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Align JVM target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/radar-src/radar_corrida/app/build.gradle.kts")
          s=p.read_text()
          needle='    compileSdk = 35\n'
          patch='''    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
'''
          if needle not in s:
              raise SystemExit("compileSdk marker not found")
          p.write_text(s.replace(needle, patch, 1))
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/radar-src/radar_corrida
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp /tmp/radar-src/radar_corrida/app/build/outputs/apk/debug/app-debug.apk /tmp/Radar-Corrida-v0.2-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Radar-Corrida-v0.2-APK
          path: /tmp/Radar-Corrida-v0.2-debug.apk
          retention-days: 1
