name: Gerar APKs
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'corrida-falada/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-apk.yml'
jobs:
  build-corrida-falada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar parser do print
        run: gradle :corrida-falada:testDebugUnitTest --stacktrace
      - name: Compilar APK
        run: gradle :corrida-falada:assembleDebug --stacktrace
      - name: Localizar APK gerado
        run: find . -type f -name '*.apk' -print
      - uses: actions/upload-artifact@v4
        with:
          name: Corrida-Falada-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
