name: Gerar APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'corrida-falada/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-apk.yml'
jobs:
  build-corrida-falada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar parser do print
        run: gradle :corrida-falada:testDebugUnitTest --stacktrace
      - name: Compilar APK
        run: gradle :corrida-falada:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Corrida-Falada-APK
          path: corrida-falada/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
