name: Gerar APK Assistente de Reunioes
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assistente-reunioes/**'
      - '.github/workflows/build-assistente-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'assistente-reunioes/**'
      - '.github/workflows/build-assistente-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar estrutura Android
        working-directory: assistente-reunioes
        run: flutter create . --platforms=android --org br.com.rafael --project-name assistente_reunioes
      - name: Baixar dependencias
        working-directory: assistente-reunioes
        run: flutter pub get
      - name: Verificar codigo
        working-directory: assistente-reunioes
        run: |
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos
      - name: Compilar APK
        working-directory: assistente-reunioes
        run: flutter build apk --release
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-Reunioes-APK
          path: assistente-reunioes/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
