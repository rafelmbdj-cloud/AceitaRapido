name: Build Corrida Certa v0.8 APK

on:
  push:
    branches:
      - build-corrida-certa-v08-trial

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        shell: bash
        run: |
          cat .tmp/radar.part1 .tmp/radar.part2 .tmp/radar.part3 .tmp/radar.part4 .tmp/radar.part5 .tmp/radar.part6 .tmp/radar.part7 > /tmp/radar.b64
          base64 -d /tmp/radar.b64 > /tmp/radar.zip
          mkdir -p /tmp/radar-src
          unzip -q /tmp/radar.zip -d /tmp/radar-src
          test -f /tmp/radar-src/radar_corrida/settings.gradle.kts

      - name: Apply Corrida Certa v0.8 design
        shell: bash
        run: |
          cp .tmp/corridacerta/MainActivity.kt /tmp/radar-src/radar_corrida/app/src/main/java/com/rafael/radarcorrida/MainActivity.kt
          cp .tmp/corridacerta/activity_main.xml /tmp/radar-src/radar_corrida/app/src/main/res/layout/activity_main.xml
          cp .tmp/corridacerta/OverlayController.kt /tmp/radar-src/radar_corrida/app/src/main/java/com/rafael/radarcorrida/OverlayController.kt
          cp .tmp/corridacerta/RideAccessibilityService.kt /tmp/radar-src/radar_corrida/app/src/main/java/com/rafael/radarcorrida/RideAccessibilityService.kt
          cp .tmp/corridacerta/RideParser.kt /tmp/radar-src/radar_corrida/app/src/main/java/com/rafael/radarcorrida/RideParser.kt
          cp .tmp/corridacerta/TrialManager.kt /tmp/radar-src/radar_corrida/app/src/main/java/com/rafael/radarcorrida/TrialManager.kt
          mkdir -p /tmp/radar-src/radar_corrida/app/src/main/res/drawable
          cp .tmp/corridacerta/app_icon.png /tmp/radar-src/radar_corrida/app/src/main/res/drawable/app_icon.png
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("/tmp/radar-src/radar_corrida/app/build.gradle.kts")
          s = gradle.read_text()
          s = s.replace('applicationId = "com.rafael.radarcorrida"', 'applicationId = "com.rafael.corridacerta"')
          s = s.replace('versionCode = 2', 'versionCode = 8')
          s = s.replace('versionName = "0.2.0"', 'versionName = "0.8.0"')
          gradle.write_text(s)

          manifest = Path("/tmp/radar-src/radar_corrida/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = m.replace('android:label="Radar Corrida"', 'android:label="Corrida Certa"')
          m = m.replace(
              '<application\n        android:allowBackup="true"',
              '<application\n        android:allowBackup="true"\n        android:icon="@drawable/app_icon"\n        android:roundIcon="@drawable/app_icon"'
          )
          m = m.replace('android:name=".MainActivity"', 'android:name="com.rafael.radarcorrida.MainActivity"')
          m = m.replace('android:name=".RideAccessibilityService"', 'android:name="com.rafael.radarcorrida.RideAccessibilityService"')
          manifest.write_text(m)

          layout = Path("/tmp/radar-src/radar_corrida/app/src/main/res/layout/activity_main.xml")
          x = layout.read_text()
          x = x.replace(
              'A faixa colorida continuará aparecendo no topo da tela quando uma oferta for lida.',
              'No topo aparece uma faixa escura escrita CORRIDA CERTA, com um semáforo vermelho, amarelo ou verde.'
          )
          x = x.replace('Corrida Certa • versão 0.3 de teste', 'Corrida Certa • versão 0.8 • teste de 90 dias')
          layout.write_text(x)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Align JVM target
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("/tmp/radar-src/radar_corrida/app/build.gradle.kts"); s=p.read_text(); old="    compileSdk = 35\n"; new="    compileSdk = 35\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"; assert old in s; p.write_text(s.replace(old,new,1))'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/radar-src/radar_corrida
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: cp /tmp/radar-src/radar_corrida/app/build/outputs/apk/debug/app-debug.apk /tmp/Corrida-Certa-v0.8-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Corrida-Certa-v0.8-APK
          path: /tmp/Corrida-Certa-v0.8-debug.apk
          retention-days: 1
